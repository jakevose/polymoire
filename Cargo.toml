[package]
name = "driftfield"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A generative visualizer that drifts between looks and moves to whatever your computer is playing."
license = "MIT"
default-run = "driftfield"

[lib]
name = "driftfield"
path = "src/lib.rs"

[[bin]]
name = "driftfield"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.36"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"

[dev-dependencies]
# Must stay on the same major version as the naga that eframe's wgpu uses.
naga = { version = "30", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Fast debug builds that still run the shader and DSP at usable speed.
[profile.dev.package."*"]
opt-level = 2

[package.metadata.packager]
product-name = "Driftfield"
identifier = "app.driftfield.visualizer"
category = "Entertainment"
out-dir = "target/dist"
binaries = [{ path = "driftfield", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "packaging/macos/Info.plist"

[package.metadata.packager.deb]
depends = ["libpulse0"]
