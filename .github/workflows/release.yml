name: Release

# Push a tag like v0.1.0 to build installers for every platform and attach them to a
# GitHub release. Run it by hand (Actions → Release → Run workflow) to get the installers
# as workflow artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb,appimage
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            formats: app
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            formats: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfuse2

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      # cargo-packager leaves the app unsigned unless given an Apple identity, and Apple
      # Silicon refuses an unsigned downloaded bundle ("damaged"). Sign it ad hoc, the
      # way scripts/mac-app.sh does (no hardened runtime, which would block audio
      # capture without extra entitlements), then build the DMG from the signed app.
      - name: Sign app and build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find target/dist -maxdepth 1 -name '*.app' | head -1)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          stage=$(mktemp -d)
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Polymoire -srcfolder "$stage" -ov -format UDZO \
            "target/dist/Polymoire_${version}_${arch}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: polymoire-${{ matrix.target }}
          path: |
            target/dist/*.deb
            target/dist/*.AppImage
            target/dist/*.exe
            target/dist/*.dmg
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
