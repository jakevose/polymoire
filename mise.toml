# Development tooling for Polymoire. Run `mise install` once, then `mise run <task>`.
[tools]
rust = { version = "1.97", components = "clippy,rustfmt" }

[env]
CARGO_TERM_COLOR = "always"

[tasks.run]
description = "Run the app (release build)"
run = "cargo run --release"

[tasks.dev]
description = "Run the app (debug build)"
run = "cargo run"

[tasks.build]
description = "Build an optimized binary"
run = "cargo build --release --locked"

[tasks.check]
description = "Type-check everything quickly"
run = "cargo check --all-targets"

[tasks.smoke]
description = "Launch the app for 20 seconds with the demo beat, then print a report"
env = { POLYMOIRE_SMOKE_SECS = "20", POLYMOIRE_DEMO = "1" }
run = "cargo run --release"

[tasks.app]
description = "macOS: build and open Polymoire.app (needed for system-audio permission)"
run = "bash scripts/mac-app.sh"

[tasks.app-smoke]
description = "macOS: smoke test the app bundle against system audio"
run = "bash scripts/mac-app.sh POLYMOIRE_SMOKE_SECS=25 POLYMOIRE_SMOKE_DIR={{config_root}}/target"

[tasks.test]
description = "Run the automated test suite"
run = "cargo test --all-targets --locked"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and clippy lints"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets --locked -- -D warnings",
]

[tasks.site]
description = "Build the website into target/site (with live release data if gh is set up)"
run = "python3 scripts/build-site.py --fetch-release"

[tasks.site-check]
description = "Check the website builds and its data is complete (deps have risk entries, screenshots exist)"
run = "python3 scripts/build-site.py --check"

[tasks.screenshots]
description = "Render the website screenshots from the demo loop (needs a GPU and Pillow)"
run = [
  "cargo run --release --example screenshots",
  "python3 scripts/compress-screenshots.py",
]

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "test", "site-check"]

[tasks.package]
description = "Build installers for this platform into target/dist"
run = "mise exec cargo:cargo-packager@latest -- cargo packager --release"
